name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out course content
        id: course-checkout
        uses: actions/checkout@v7
        with:
          repository: gdguesser/learn-java-with-tests
          path: ../learn-java-with-tests

      - name: Sync TDD course content
        if: steps.course-checkout.outcome == 'success'
        run: npm run tdd:sync

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run lint

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Run link and accessibility smoke tests
        run: npm test
